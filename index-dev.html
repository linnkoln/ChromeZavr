<!DOCTYPE html>
<!-- ============================================================
     DEV-СБОРКА (index-dev.html)
     Та же страница, что loading-page.html (PROD), но с включёнными
     функциями разработчика: enableDevFeatures() + чит-панель.
     ============================================================ -->
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Загрузка [DEV]</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, sans-serif;
    background: #f5f5f5;
  }
  .box { text-align: center; }
  button {
    font-size: 18px;
    padding: 14px 32px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: #fff;
    cursor: pointer;
  }
  button:disabled { background: #93c5fd; cursor: default; }
  #progress-wrap {
    width: 300px;
    height: 12px;
    background: #ddd;
    border-radius: 6px;
    margin: 20px auto 0;
    overflow: hidden;
    display: none;
  }
  #progress-bar {
    width: 0%;
    height: 100%;
    background: #2563eb;
    transition: width 0.3s linear;
  }
  #done-msg {
    margin-top: 20px;
    color: #16a34a;
    font-weight: 600;
    display: none;
  }
  #hint {
    margin-top: 16px;
    color: #555;
    display: none;
  }
  #game-placeholder {
    margin: 24px auto 0;
    width: 480px;
    max-width: 90vw;
    height: 240px;
    border: 2px dashed #2563eb;
    border-radius: 8px;
    display: none;
    align-items: center;
    justify-content: center;
    color: #2563eb;
    font-size: 16px;
    background: #eff6ff;
  }
  #reload-btn { display: none; background: #16a34a; }

  /* --- Чит-панель разработчика --- */
  #dev-panel {
    position: fixed;
    top: 12px; right: 12px;
    background: #111827;
    color: #f9fafb;
    border-radius: 10px;
    padding: 14px;
    font-size: 13px;
    text-align: left;
    box-shadow: 0 4px 16px rgba(0,0,0,0.35);
    z-index: 1000;
    min-width: 210px;
  }
  #dev-panel h4 { margin: 0 0 8px; font-size: 13px; color: #fbbf24; }
  #dev-panel button {
    font-size: 12px;
    padding: 6px 10px;
    margin: 3px 2px;
    background: #374151;
    border-radius: 6px;
  }
  #dev-panel button.on { background: #16a34a; }
  #dev-panel .badge {
    display: inline-block;
    background: #dc2626;
    color: #fff;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
    vertical-align: middle;
    margin-left: 6px;
  }
</style>
</head>
<body>
  <div id="dev-panel">
    <h4>DEV-панель <span class="badge">DEV</span></h4>
    <button id="dev-god">GodMode: OFF</button><br>
    <button id="dev-skip">Пропустить загрузку</button><br>
    <button id="dev-restart">Рестарт игры</button><br>
    <label>Скорость игры:
      <select id="dev-speed">
        <option value="0.5">0.5×</option>
        <option value="1" selected>1×</option>
        <option value="2">2×</option>
        <option value="4">4×</option>
      </select>
    </label>
  </div>

  <div class="box">
    <button id="start-btn">Начать загрузку</button>
    <div id="progress-wrap"><div id="progress-bar"></div></div>
    <div id="done-msg">✅ Загрузка завершена!</div>
    <div id="hint">Нажмите пробел или кнопку мышки, чтобы начать игру</div>
    <button id="reload-btn">Загрузка завершена — перезагрузить</button>
    <div id="game-placeholder">🎮 PLACEHOLDER ИГРЫ<br>(здесь будет игра)</div>
  </div>

<script>
  // Хук для DEV: skipLoading() мгновенно завершает загрузку
  window.__czFinishLoadingNow = function () {
    if (!window.__czLoadingDone) {
      window.__czLoadingDone = true;
      finishLoading();
    }
  };
</script>
<!-- Файлы эпох: порядок подключения = порядок прохождения -->
<script src="assets/epochs/01-sapiens.js"></script>
<script src="assets/epochs/02-erectus.js"></script>
<script src="assets/epochs/03-first-mammals.js"></script>
<script src="assets/epochs/04-tiktaalik.js"></script>
<script src="assets/epochs/05-luca.js"></script>
<script src="engine.js"></script>
<script>
  // Включаем функции разработчика — в PROD этого вызова нет
  var dev = enableDevFeatures();

  var btn = document.getElementById('start-btn');
  var wrap = document.getElementById('progress-wrap');
  var bar = document.getElementById('progress-bar');
  var doneMsg = document.getElementById('done-msg');
  var hint = document.getElementById('hint');
  var game = document.getElementById('game-placeholder');
  var reloadBtn = document.getElementById('reload-btn');
  var DURATION = 30000; // 30 секунд

  var loaded = false;
  var gameStarted = false;

  function onLoadingFinished() {
    // TODO: реальное действие / переход
  }

  function startLoading() {
    var start = Date.now();
    var timer = setInterval(function () {
      if (window.__czLoadingDone) { clearInterval(timer); return; }
      var pct = Math.min(100, (Date.now() - start) / DURATION * 100);
      setProgress(pct);
      if (pct >= 100) { clearInterval(timer); finishLoading(); }
    }, 100);
  }

  function setProgress(pct) { bar.style.width = pct + '%'; }

  function finishLoading() {
    loaded = true;
    wrap.style.display = 'none';
    if (gameStarted) {
      reloadBtn.style.display = 'inline-block';
    } else {
      doneMsg.style.display = 'block';
      onLoadingFinished();
      setTimeout(function () { location.reload(); }, 2000);
    }
  }

  btn.addEventListener('click', function () {
    btn.style.display = 'none';
    wrap.style.display = 'block';
    hint.style.display = 'block';
    startLoading();
  });

  function tryStartGame(e) {
    if (e.target.closest('button')) return;
    if (e.target.closest('#dev-panel')) return;
    if (gameStarted) return;
    gameStarted = true;
    hint.style.display = 'none';
    game.style.display = 'flex';
    ChromeZavrGame.start();
    if (loaded) {
      doneMsg.style.display = 'none';
      reloadBtn.style.display = 'inline-block';
    }
  }

  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space') {
      e.preventDefault();
      tryStartGame(e);
      ChromeZavrGame.jump();
    }
  });
  document.addEventListener('click', function (e) {
    tryStartGame(e);
    ChromeZavrGame.jump();
  });

  reloadBtn.addEventListener('click', function () {
    location.reload();
  });

  // --- Чит-панель ---
  var godBtn = document.getElementById('dev-god');
  godBtn.addEventListener('click', function () {
    var on = dev.toggleGodMode();
    godBtn.textContent = 'GodMode: ' + (on ? 'ON' : 'OFF');
    godBtn.classList.toggle('on', on);
  });
  document.getElementById('dev-skip').addEventListener('click', function () {
    dev.skipLoading();
  });
  document.getElementById('dev-restart').addEventListener('click', function () {
    dev.restart();
  });
  document.getElementById('dev-speed').addEventListener('change', function () {
    dev.setSpeedMultiplier(parseFloat(this.value));
  });
</script>
</body>
</html>
